[package]
name = "apptide-beta"
version = "0.2.5-beta.1"
edition = "2024"
license = "MIT"
description = "AppTide native Windows software manager"
repository = "https://github.com/GitKama/AppTide"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
fs2 = "0.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

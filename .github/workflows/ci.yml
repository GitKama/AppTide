name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: AppTide-windows-x64-alpha
          path: dist/AppTide-win32-x64/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-desktop-checks
          path: |
            artifacts/**/result.json
            artifacts/**/desktop.png
            artifacts/**/compact.png
            artifacts/**/history.png

name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-docs.py
  rust-beta:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-rust-1.99-${{ hashFiles('rust/Cargo.lock', 'rust/.cargo/config.toml') }}
          restore-keys: ${{ runner.os }}-rust-1.99-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ../scripts/check-advisories.py
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: AppTide-rust-beta-windows-x64
          path: rust/target/release/apptide-beta.exe

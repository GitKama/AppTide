name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust-beta:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: AppTide-rust-beta-windows-x64
          path: rust/target/release/apptide-beta.exe
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: AppTide-windows-x64-alpha
          path: dist/AppTide-win32-x64/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-desktop-checks
          path: |
            artifacts/**/result.json
            artifacts/**/desktop.png
            artifacts/**/compact.png
            artifacts/**/history.png

name: Bug report
description: Report a reproducible AppTide problem with a sanitized example.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Check the latest beta and existing issues first. Never attach raw catalogues, full installer logs, credentials or personal paths. Vulnerabilities belong in the reporting process in SECURITY.md, not this public form.
  - type: input
    id: version
    attributes:
      label: AppTide and Windows versions
      placeholder: "AppTide 0.2.x-beta.n; Windows version/build; x64"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - WinGet update or uninstall
        - Microsoft Store
        - GitHub project or installer
        - AppTide self-update
        - Detection or installed version
        - Steam library
        - Interface or accessibility
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected behavior and actual result
      description: Include the public package ID or project URL if relevant, installed/target versions, and whether one app or the whole queue failed.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Minimal sanitized evidence
      description: Supply the Activity outcome/error code or a small redacted excerpt. For unknown versions, include the metadata source shown in the app. Do not upload your entire local log or catalogue.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-report check
      options:
        - label: I removed private paths, usernames, credentials and personal inventory from this report.
          required: true
